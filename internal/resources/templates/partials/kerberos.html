<h1 class="page-title">Kerberos Management</h1>
<p class="page-description">View and manage Kerberos Accounts.</p>



<div class="section-block">
  <h3>Principal Accounts</h3>
  <table class="data-table">
    <thead>
      <tr>
        <th>Principal Name</th>
        <th>Encryption Type</th>
        <th>Date Created</th>
        <th>Is Service Principal</th>
      </tr>
    </thead>
      <tbody hx-get="http://krb.scorpio.ordinarycomputing.com:8083/ui/metadata" hx-trigger="load" hx-swap="innerHTML" hx-target="this" data-cert-table="true">
        <tr>
          <td colspan="6">Loading Principals...</td>
        </tr>
      </tbody>
    </table>
  </div>
    <script>
    function escapeHtml(text) {
      return String(text || '').replace(/[&<>"']/g, function(match) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[match];
      });
    }

    document.addEventListener('htmx:beforeSwap', function(evt) {
      if (!evt.target.matches('tbody[data-cert-table]')) {
        return;
      }

      var xhr = evt.detail.xhr;
      if (!xhr) {
        return;
      }

      var contentType = xhr.getResponseHeader('Content-Type') || '';
      if (contentType.indexOf('application/json') === -1) {
        return;
      }

      try {
        var data = JSON.parse(xhr.responseText);
      } catch (err) {
        return;
      }

      var rows = '';
      if (Array.isArray(data.accounts) && data.accounts.length > 0) {
        data.accounts.forEach(function(account) {

          rows += '<tr>' +
            '<td>' + escapeHtml(account.principal_name) + '</td>' +
            '<td>' + escapeHtml(account.encryption_type) + '</td>' +
            '<td>' + escapeHtml(account.date_created) + '</td>' +
            '<td>' + escapeHtml(account.is_service_principal) + '</td>' +
            '</tr>';
        });
      }

      if (!rows) {
        rows = '<tr><td colspan="6">No Principals found</td></tr>';
      }

      evt.detail.shouldSwap = false;
      evt.target.innerHTML = rows;
    });
  </script>
